[platformio]
default_envs = esp32-direct

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MPU6050@2.2.6
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit Unified Sensor@1.1.15
build_flags = -DGLOVE_HANDS=1

[env:esp32-usb]
platform = espressif32@6.12.0
board = esp32dev

[env:esp32-direct]
platform = espressif32@6.12.0
board = esp32dev
build_flags = ${env.build_flags} -DUSE_DIRECT_FLEX=1

[env:esp32-bluetooth]
platform = espressif32@6.12.0
board = esp32dev
build_flags = ${env.build_flags} -DENABLE_BT=1

[env:esp32-two-hands]
platform = espressif32@6.12.0
board = esp32dev
build_flags = -DGLOVE_HANDS=2

[env:esp32-audio]
platform = espressif32@6.12.0
board = esp32dev
build_flags = ${env.build_flags} -DENABLE_DFPLAYER=1

[env:nano-usb]
platform = atmelavr@5.1.0
board = nanoatmega328

[env:nano-bluetooth]
platform = atmelavr@5.1.0
board = nanoatmega328
build_flags = ${env.build_flags} -DENABLE_BT=1 -DSAMPLE_PERIOD_MS=250
